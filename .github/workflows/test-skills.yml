name: Test skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Determine whether tests are needed
    runs-on: ubuntu-latest
    outputs:
      should_test: ${{ steps.filter.outputs.should_test }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import fnmatch
          import os
          import subprocess
          from pathlib import Path

          event_name = os.environ["EVENT_NAME"]
          base_sha = os.environ.get("BASE_SHA", "")
          head_sha = os.environ["HEAD_SHA"]

          if event_name == "workflow_dispatch":
              changed_paths = ["<manual-run>"]
              should_test = True
          else:
              if not base_sha or set(base_sha) == {"0"}:
                  command = ["git", "ls-tree", "-r", "--name-only", head_sha]
              else:
                  command = ["git", "diff", "--name-only", base_sha, head_sha]

              result = subprocess.run(
                  command,
                  check=True,
                  capture_output=True,
                  text=True,
              )
              changed_paths = [
                  path for path in result.stdout.splitlines() if path
              ]
              exclusion_file = Path("exclude-from-testing.txt")
              patterns = [
                  line.strip()
                  for line in exclusion_file.read_text(encoding="utf-8").splitlines()
                  if line.strip() and not line.lstrip().startswith("#")
              ] if exclusion_file.is_file() else []
              should_test = any(
                  not any(
                      fnmatch.fnmatchcase(path, pattern)
                      for pattern in patterns
                  )
                  for path in changed_paths
              )

          print("Changed paths:", changed_paths)
          print("Run tests:", should_test)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_test={str(should_test).lower()}\n")
          PY

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: changes
    if: needs.changes.outputs.should_test == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall -q skills tests

      - name: Lint tests
        run: python -m ruff check tests

      - name: Run tests
        run: python -m pytest -q
